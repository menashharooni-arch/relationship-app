name: "Agent: chat turn (draft-only)"
# One agent's turn in the company group chat (Admin → Agent Flow → Chat). The
# chat API dispatches this once per @-mentioned responder; the watchdog loop
# re-dispatches turns that never started. DRAFT-ONLY like every other agent:
# the model gets WebSearch/WebFetch only and the runner's sole write is our own
# agent_* tables. A "fix" the owner asks for becomes a queue item + a Fixer
# draft PR — nothing merges, nothing deploys. See marketing-agents/chat-turn.mjs.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "responder id: an agent_id (seo, manager …) or a lead (maya, sasha, nina, rex)"
        required: true
      trigger:
        description: "chat"
        default: "chat"
concurrency:
  group: agent-chat-${{ github.event.inputs.agent }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write   # to wake a delegated colleague, the Fixer, or its own full run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Take the chat turn
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'chat' }}
          CHAT_RESPONDER: ${{ github.event.inputs.agent }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENT_RELAY_SECRET: ${{ secrets.AGENT_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node marketing-agents/chat-turn.mjs "$CHAT_RESPONDER"

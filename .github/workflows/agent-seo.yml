name: "Agent: seo"
# Manually triggered from the Agent Flow tab. Writes only to agent_* tables
# (and, for blog in auto mode, the agent_blog_posts table). No git, no gh, no
# deploys, no platform APIs.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | start_all | schedule"
        default: "manual"
concurrency:
  group: agent-seo
  cancel-in-progress: false
permissions:
  contents: read
  actions: write  # dispatches the Fixer when this run has findings
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Run agent
        id: run
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENT_RELAY_SECRET: ${{ secrets.AGENT_RELAY_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node marketing-agents/agent-seo.mjs
      # Jake has TWO jobs. The audit above is deterministic and free (no LLM), so
      # it must keep running even when the Claude plan's window is used up —
      # that is why page-writing is a separate step through the LLM runner
      # rather than folded into agent-seo.mjs. `continue-on-error` keeps a
      # stood-down writer from failing the audit that already succeeded.
      - name: Write one SEO landing page
        continue-on-error: true
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENT_RELAY_SECRET: ${{ secrets.AGENT_RELAY_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node marketing-agents/run-agent.mjs seo

      - name: Hand findings to the Fixer (draft-PR pipeline)
        if: steps.run.outputs.findings != '' && steps.run.outputs.findings != '0' && steps.run.outputs.item_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run agent-fixer.yml -f item_id="${{ steps.run.outputs.item_id }}" && echo "Fixer dispatched for item ${{ steps.run.outputs.item_id }}"

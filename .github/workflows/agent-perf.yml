name: "Agent: perf"
# Speed watchdog — times the critical routes against its own rolling baseline,
# flags regressions, emails immediately when a critical route is down or
# crawling. $0 per run (no LLM). Writes only to agent_* tables.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | start_all | schedule"
        default: "manual"
concurrency:
  group: agent-perf
  cancel-in-progress: false
permissions:
  contents: read
  actions: write  # dispatches the Fixer when this run has findings
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Run agent
        id: run
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENT_RELAY_SECRET: ${{ secrets.AGENT_RELAY_SECRET }}
        run: node marketing-agents/agent-perf.mjs
      - name: Hand findings to the Fixer (draft-PR pipeline)
        if: steps.run.outputs.findings != '' && steps.run.outputs.findings != '0' && steps.run.outputs.item_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run agent-fixer.yml -f item_id="${{ steps.run.outputs.item_id }}" && echo "Fixer dispatched for item ${{ steps.run.outputs.item_id }}"

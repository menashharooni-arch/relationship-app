name: "Agent: prospects (draft-only)"
# Manually triggered from the Agent Flow tab (or here). DRAFT-ONLY by
# construction: the runner allows the model WebSearch/WebFetch only — no Bash,
# no git, no gh, no platform APIs — and the runner's sole write is our own
# agent_* tables. It cannot post, DM, comment, merge, or deploy. See
# marketing-agents/run-agent.mjs for the enforcement.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | start_all | schedule"
        default: "manual"
concurrency:
  group: agent-prospects
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run agent
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node marketing-agents/run-agent.mjs prospects

name: "Agent: deliverability"
# Della — Email & Push Delivery. Code-only, read-only against the live site and our own
# tables; $0 per run (no LLM). The watchdog loop (agent-watchdog.yml) is the
# continuous watch; this run is the written full pass. Writes only agent_* tables.
on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | start_all | schedule"
        default: "manual"
concurrency:
  group: agent-deliverability
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Run agent
        id: run
        env:
          AGENT_TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AGENT_RELAY_SECRET: ${{ secrets.AGENT_RELAY_SECRET }}
        run: node marketing-agents/agent-watch.mjs deliverability

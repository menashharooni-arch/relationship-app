<script>
/* COLD LAUNCH ONLY. The cookie below keeps the payload off repeat requests, but
   it expires — and once it has, any in-app hard navigation (sign out, Upgrade,
   the account-deleted screen, a reset-password bounce: eight of them at last
   count) would re-fire the lightning mid-session. A referrer from our own
   origin is the precise signal that this is a navigation rather than a launch,
   and it is checked BEFORE the overlay is parsed, so the suppressed case never
   paints a frame. A real launch (and a universal link from another app) has no
   same-origin referrer and still plays. A pull-to-refresh reads as a
   navigation, which is right — a reload should not replay a launch animation.
   ARMED, OR NOT SHOWN AT ALL: the overlay is display:none unless this script
   adds `sc-splash-armed`. When React inserts this markup during a client-side
   navigation (a tab tap) the browser never runs this script, so there was
   nothing to say "not a launch" and the default was to play. The default is
   now to stay hidden; only a parse-time run of this script can show it. */
try{var d=document.documentElement;if(document.referrer&&document.referrer.indexOf(location.origin)===0){d.classList.add("sc-nosplash")}else{d.classList.add("sc-splash-armed");d.classList.add("sc-splash-hold")}}catch(e){}
</script>

     SWIFTCARD LAUNCH SPLASH — "VERTICAL FORK"
     Hands off from the static iOS launch image (the navy field with the square icon, which is what THIS build has compiled in), then cross-fades to the new screen at 110-320ms
     and returns the screen to the app in 1400ms.

     TIMELINE (master clock = 1400ms; every % below is annotated in ms)
       0-110ms    HOLD      pixel-identical to the launch image. Nothing moves.
       110-150    CHARGE    a faint charge builds in the air. Something is coming.
       150-295    FORK      a vertical bolt tears top to centre, throwing 3 branches
                            that keep splitting down past the logo to the ground.
       295-300    CONTACT   the trunk lands dead centre, on the logo.
       300-470    IGNITION  full-screen flash, the logo pops + a white-hot flare
                            blooms out of it, the fork flickers twice and dies.
       470-700    SETTLE    bloom decays. The logo sits, lit, at rest.
       700-1250   APERTURE  the logo's own bolt opens: a bolt-shaped hole grows
                            out of it, lit from within, until the app is through it.
       1130-1330  CLEAR     the last navy corners dissolve under the opening.
       1400       the overlay removes itself from the DOM.
     ═════════════════════════════════════════════════════════════════════════ -->

/* ── layer 1: the navy ground ─────────────────────────────────────────────
   Two mask layers — the bolt, and a full-bleed white one — composited so the
   bolt is SUBTRACTED, leaving a bolt-shaped hole. Three things are load-bearing:

   1. Alpha masking. The bolt asset is an opaque bolt on a transparent field with no
      alpha channel; under the default match-source it masks as a solid SQUARE.
      Luminance is also correct if the asset is ever swapped for a transparent
      PNG (luminance × alpha), so it is the safe reading either way.
   2. the second layer is WHITE, not black — under luminance a black layer has
      zero luminance and would contribute nothing to subtract from.
   3. `xor` then `exclude`: iOS 15 takes the legacy keyword, modern WebKit and
      Blink take the standard one. Verified identical in both. If an engine knew
      neither it would fall back to `add` (a solid plane) and the splash would
      simply cross-fade instead of opening — degraded, never broken. */
.vfk-plane{
  inset:0;
  background:radial-gradient(137.06vmax 137.06vmax at 11.46% -112.88%,rgba(255,255,255,0.03) 0%,rgba(255,255,255,0.03) 97.23%,rgba(255,255,255,0) 100%),linear-gradient(146.5deg,#2c489f 0%,#111b49 100%) 50% 50% / 100vmax 100vmax no-repeat,#1f3274;
  -webkit-mask-image:var(--vfk-bolt),linear-gradient(#fff,#fff);
          mask-image:var(--vfk-bolt),linear-gradient(#fff,#fff);
  -webkit-mask-repeat:no-repeat,no-repeat;
          mask-repeat:no-repeat,no-repeat;
  -webkit-mask-position:50% 50%,50% 50%;
          mask-position:50% 50%,50% 50%;
  -webkit-mask-size:calc(var(--vfk-mark) * 0.0000) calc(var(--vfk-mark) * 0.0000),100% 100%;      /* closed. Frame 0 is a flat navy field. */
          mask-size:calc(var(--vfk-mark) * 0.0000) calc(var(--vfk-mark) * 0.0000),100% 100%;
  /* NO mask-mode. The bolt asset ships as an OPAQUE bolt on a TRANSPARENT
     field, so the default alpha masking is already correct — and under
     luminance the black `linear-gradient(#000,#000)` cover layer evaluates to
     zero, which masked the navy plane away entirely and left frame 0 showing
     the app instead of the launch image. Alpha also works on iOS 15.0-15.3,
     where mask-mode does not exist at all. */
  -webkit-mask-composite:xor;               /* iOS 15 */
          mask-composite:exclude;           /* modern WebKit/Blink */
  animation:vfk-aperture 550ms linear 700ms both;
}

@keyframes vfk-legacy-out{
  0%{ opacity:1 }
  7.8571%{ opacity:1 }   /* 110ms  the hold ends */
  22.8571%{ opacity:0 }   /* 320ms  now it is the new screen */
  100%{ opacity:0 }
}
/* ── layer 2: ignition bloom, behind the logo ───────────────────────────── */
.vfk-halo{
  left:50%; top:50%; width:calc(var(--vfk-mark) * 3.9286); height:calc(var(--vfk-mark) * 3.9286);
  margin:calc(calc(var(--vfk-mark) * 3.9286) / -2) 0 0 calc(calc(var(--vfk-mark) * 3.9286) / -2);
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    rgba(120,190,255,.60) 0%, rgba(37,99,235,.34) 30%,
    rgba(29,63,184,.14) 54%, rgba(26,35,66,0) 74%);
  opacity:0;
  will-change:transform,opacity;
  animation:vfk-halo 1400ms linear both;
}

/* ── layer 3: THE LOGO ──────────────────────────────────────────────────────
   at 20.351vmax, dead centre, opaque from the first frame — the launch image, continued.
   Only transform and opacity are ever touched. */
.vfk-icon{
  left:50%; top:50%; width:var(--vfk-mark); height:var(--vfk-mark);
  margin:calc(var(--vfk-mark) / -2) 0 0 calc(var(--vfk-mark) / -2);
  display:block;
  transform:scale(1);
  transform-origin:50% 50%;
  will-change:transform,opacity;
  backface-visibility:hidden;
  animation:vfk-icon 1400ms linear both;
}

/* ── layer 4: white-hot flare over the logo (light, not a recolour) ──────── */
.vfk-flare{
  left:50%; top:50%; width:calc(var(--vfk-mark) * 2.8571); height:calc(var(--vfk-mark) * 2.8571);
  margin:calc(calc(var(--vfk-mark) * 2.8571) / -2) 0 0 calc(calc(var(--vfk-mark) * 2.8571) / -2);
  border-radius:50%;
  mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.95) 0%, rgba(219,236,255,.70) 16%,
    rgba(120,185,255,.34) 40%, rgba(37,99,235,0) 70%);
  opacity:0;
  will-change:transform,opacity;
  animation:vfk-flare 1400ms linear both;
}

/* ── layer 5: the fork ────────────────────────────────────────────────────
   `slice` guarantees the artwork covers 320×568 through 430×932 with the fork's
   contact point pinned to the exact centre of the display on every one of them.
   Two passes make the bolt: a blurred aurora stroke under a thin white core that
   carries the drop-shadow halo. Both filters are static, never animated. */
.vfk-fork{
  inset:0; width:100%; height:100%;
  overflow:visible;
}
.vfk-bolt{
  opacity:0;
  will-change:opacity;
  animation:vfk-flicker 1400ms linear both;
}
/* Stroke widths are in viewBox units on purpose: `slice` scales them 3.2x on a
   320x568 up to 4.7x on a 430x932, so the bolt gets proportionally heavier on a
   bigger display, which is what the eye expects. vector-effect:non-scaling-stroke
   would pin them to CSS px — but WebKit then computes the dash pattern in device
   space while pathLength normalises in user space, and the strike draws itself as
   disconnected debris instead of one tear. Do not add it back. */
.vfk-bolt path{
  fill:none;
  stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:1 1;            /* pathLength="1" -> resolution-independent dashes */
  stroke-dashoffset:1;             /* undrawn */
  will-change:stroke-dashoffset;
}
.vfk-glow path{ stroke:#4DA8F5; }
.vfk-glow{ filter:blur(3px); opacity:.9; }
.vfk-core path{ stroke:#F4F9FF; }
.vfk-core{
  filter:
    drop-shadow(0 0 2px rgba(255,255,255,.95))
    drop-shadow(0 0 9px rgba(125,185,255,.85))
    drop-shadow(0 0 26px rgba(37,99,235,.6));
}
/* propagation: out of the gate hard, settling into the impact */
.vfk-t1{ animation:vfk-draw 145ms cubic-bezier(.16,.72,.32,1) 150ms both; }
.vfk-b3{ animation:vfk-draw  70ms cubic-bezier(.2,.7,.4,1)    196ms both; }
.vfk-b1{ animation:vfk-draw 120ms cubic-bezier(.18,.66,.36,1) 205ms both; }
.vfk-b2{ animation:vfk-draw 115ms cubic-bezier(.18,.66,.36,1) 225ms both; }
.vfk-t2{ animation:vfk-draw  95ms cubic-bezier(.3,.72,.4,1)   295ms both; }
.vfk-core .vfk-t1{ stroke-width:.72 } .vfk-glow .vfk-t1{ stroke-width:2.3 }
.vfk-core .vfk-b3{ stroke-width:.34 } .vfk-glow .vfk-b3{ stroke-width:1.1 }
.vfk-core .vfk-b1{ stroke-width:.52 } .vfk-glow .vfk-b1{ stroke-width:1.7 }
.vfk-core .vfk-b2{ stroke-width:.46 } .vfk-glow .vfk-b2{ stroke-width:1.5 }
.vfk-core .vfk-t2{ stroke-width:.62 } .vfk-glow .vfk-t2{ stroke-width:2.0 }

/* ── layer 6: impact flash, whole display ───────────────────────────────── */
.vfk-flash{
  inset:0;
  background:radial-gradient(125% 92% at 50% 50%,
    rgba(255,255,255,.94) 0%, rgba(196,225,255,.52) 32%,
    rgba(37,99,235,.14) 60%, rgba(26,35,66,0) 84%);
  opacity:0;
  will-change:opacity;
  animation:vfk-flash 1400ms linear both;
}

/* ── layer 7: the light inside the aperture ───────────────────────────────
   The bolt itself rather than the hole, so it shares the exact same keyframes:
   a mask-size list longer than the mask-image list simply has its extra values
   ignored, which is why one @keyframes block can drive both this single-layer
   mask and the plane's two-layer one. (The obvious alternative — the same two
   layers composited `intersect`/`source-in` — is silently ignored by WebKit and
   renders the layer full-bleed across the whole display. Don't.)
   scale(1.06) keeps this a hair proud of the hole so the cut edge never shows. */
.vfk-light{
  inset:0;
  background:radial-gradient(circle at 50% 50%,
    #FFFFFF 0%, #E3EEFF 10%, #8FC2FF 28%, #2563EB 56%, #1D3FB8 100%);
  transform:scale(1.06);
  filter:blur(1px);   /* veils the mask's cut edge while it is still on-screen */
  opacity:0;
  -webkit-mask-image:var(--vfk-bolt);   /* ONE layer: this element IS the bolt, not the hole. */
          mask-image:var(--vfk-bolt);
  -webkit-mask-repeat:no-repeat;
          mask-repeat:no-repeat;
  -webkit-mask-position:50% 50%;
          mask-position:50% 50%;
  -webkit-mask-size:calc(var(--vfk-mark) * 0.0000) calc(var(--vfk-mark) * 0.0000);
          mask-size:calc(var(--vfk-mark) * 0.0000) calc(var(--vfk-mark) * 0.0000);
  /* Alpha masking, as above. */
  will-change:opacity;
  animation:vfk-aperture 550ms linear 700ms both,
            vfk-light    1400ms linear both;
}

/* ══ KEYFRAMES ═══════════════════════════════════════════════════════════ */

/* THE STRIKE TRAVELS. One path drawing itself, tip-first. */
@keyframes vfk-draw{ from{ stroke-dashoffset:1 } to{ stroke-dashoffset:0 } }

/* WHAT THE EYE SEES: nothing → a charge in the air → the bolt, hard →
   it hangs, flickers twice like real lightning → gone. */
@keyframes vfk-flicker{
  0%,7.86%   { opacity:0    }   /* 0–110ms   invisible. The handoff window. */
  10.71%     { opacity:.34   }  /* 150ms     the air charges */
  15%        { opacity:1     }  /* 210ms     full brightness mid-descent */
  17.14%     { opacity:.72   }  /* 240ms     flicker */
  21.07%     { opacity:1     }  /* 295ms     contact */
  24.29%     { opacity:1     }  /* 340ms     holds hot through the ignition */
  25.36%     { opacity:.42   }  /* 355ms     first collapse */
  26.43%     { opacity:.88   }  /* 370ms     second discharge */
  27.14%     { opacity:.30   }  /* 380ms */
  30.71%     { opacity:.12   }  /* 430ms */
  33.57%,100%{ opacity:0     }  /* 470ms     the sky is empty again */
}

/* THE LOGO IGNITES. Perfectly still until the bolt lands, then a hard pop that
   overshoots, undershoots, and settles — the read is "it arrived", not "it grew".
   It then holds, lit, and only leaves once its own bolt has opened past it. */
@keyframes vfk-icon{
  0%,21.43%  { opacity:1; transform:scale(1)      }  /* 0–300ms   FRAME 0. Identical to the launch image. */
  25.36%     { opacity:1; transform:scale(1.155)  }  /* 355ms     struck */
  31.43%     { opacity:1; transform:scale(.975)   }  /* 440ms     recoil */
  37.14%     { opacity:1; transform:scale(1.012)  }  /* 520ms */
  42.86%     { opacity:1; transform:scale(1)      }  /* 600ms     at rest */
  55.71%     { opacity:1; transform:scale(1)      }  /* 780ms     the aperture is already opening inside its bolt */
  62.14%     { opacity:0; transform:scale(1.03)   }  /* 870ms     handed over to the light */
  100%       { opacity:0; transform:scale(1.03)   }
}

/* THE BLOOM behind it: a fast punch of aurora light, then a long decay that
   keeps the logo sitting in its own glow while the aperture starts. */
@keyframes vfk-halo{
  0%,21.14%  { opacity:0;   transform:scale(.34) }  /* 0–296ms  */
  24.29%     { opacity:.95; transform:scale(1.04)}  /* 340ms     bloom */
  27.14%     { opacity:.72; transform:scale(1.01)}  /* 380ms */
  33.57%     { opacity:.50; transform:scale(1)   }  /* 470ms */
  50%        { opacity:.34; transform:scale(1)   }  /* 700ms     settled ambience */
  61.43%     { opacity:.20; transform:scale(1.18)}  /* 860ms     pushed outward by the opening */
  67.14%,100%{ opacity:0;   transform:scale(1.3) }  /* 940ms */
}

/* THE FLARE at the point of impact: a white core that blows out of the mark. */
@keyframes vfk-flare{
  0%,21.43%  { opacity:0;   transform:scale(.5)  }  /* 0–300ms  */
  22.71%     { opacity:1;   transform:scale(.92) }  /* 318ms     white-hot */
  26.43%     { opacity:.34; transform:scale(1.02)}  /* 370ms */
  28%        { opacity:.55; transform:scale(1.06)}  /* 392ms     re-strike */
  37.14%,100%{ opacity:0;   transform:scale(1.16)}  /* 520ms     cooled */
}

/* THE WHOLE DISPLAY FLASHES. Two beats, 60ms apart — the double-tap of a real strike. */
@keyframes vfk-flash{
  0%,21.14%  { opacity:0   }  /* 0–296ms  */
  22.29%     { opacity:.85 }  /* 312ms     impact */
  25%        { opacity:.16 }  /* 350ms */
  26.57%     { opacity:.44 }  /* 372ms     second beat */
  32.86%,100%{ opacity:0   }  /* 460ms */
}

/* THE APERTURE. The hole is the logo's own bolt, opening.
   The easing is baked into the stop VALUES and the animation itself runs linear:
   it accelerates out of the mark, then decelerates into the display so the last
   half is a calm opening rather than a whip-pan. Doing it this way also means
   that if an engine ever refused to interpolate a mask-size list, this degrades
   to 21 visible steps rather than to a jump-cut.
   Sizes are the MASK BOX; the bolt inside it is ~71% tall and ~26% wide, so the
   opening clears the corners of a 430×932 at roughly the 1960px stop — measured,
   not guessed, on 320×568 / 390×844 / 430×932. */
@keyframes vfk-aperture{

  5%   { -webkit-mask-size:calc(var(--vfk-mark) * 0.0446) calc(var(--vfk-mark) * 0.0446),100% 100%;       mask-size:calc(var(--vfk-mark) * 0.0446) calc(var(--vfk-mark) * 0.0446),100% 100%       } /* 727ms   a spark inside the mark */
  10%  { -webkit-mask-size:calc(var(--vfk-mark) * 0.2321) calc(var(--vfk-mark) * 0.2321),100% 100%;     mask-size:calc(var(--vfk-mark) * 0.2321) calc(var(--vfk-mark) * 0.2321),100% 100%     } /* 755ms */
  15%  { -webkit-mask-size:calc(var(--vfk-mark) * 0.5536) calc(var(--vfk-mark) * 0.5536),100% 100%;     mask-size:calc(var(--vfk-mark) * 0.5536) calc(var(--vfk-mark) * 0.5536),100% 100%     } /* 782ms */
  20%  { -webkit-mask-size:calc(var(--vfk-mark) * 1) calc(var(--vfk-mark) * 1),100% 100%;   mask-size:calc(var(--vfk-mark) * 1) calc(var(--vfk-mark) * 1),100% 100%   } /* 810ms   exactly the logo's own bolt */
  25%  { -webkit-mask-size:calc(var(--vfk-mark) * 1.4732) calc(var(--vfk-mark) * 1.4732),100% 100%;   mask-size:calc(var(--vfk-mark) * 1.4732) calc(var(--vfk-mark) * 1.4732),100% 100%   } /* 837ms */
  30%  { -webkit-mask-size:calc(var(--vfk-mark) * 2.0089) calc(var(--vfk-mark) * 2.0089),100% 100%;   mask-size:calc(var(--vfk-mark) * 2.0089) calc(var(--vfk-mark) * 2.0089),100% 100%   } /* 865ms */
  35%  { -webkit-mask-size:calc(var(--vfk-mark) * 2.5893) calc(var(--vfk-mark) * 2.5893),100% 100%;   mask-size:calc(var(--vfk-mark) * 2.5893) calc(var(--vfk-mark) * 2.5893),100% 100%   } /* 892ms */
  40%  { -webkit-mask-size:calc(var(--vfk-mark) * 3.2143) calc(var(--vfk-mark) * 3.2143),100% 100%;   mask-size:calc(var(--vfk-mark) * 3.2143) calc(var(--vfk-mark) * 3.2143),100% 100%   } /* 920ms   A WINDOW: the app, seen through a bolt */
  45%  { -webkit-mask-size:calc(var(--vfk-mark) * 3.9286) calc(var(--vfk-mark) * 3.9286),100% 100%;   mask-size:calc(var(--vfk-mark) * 3.9286) calc(var(--vfk-mark) * 3.9286),100% 100%   } /* 947ms */
  50%  { -webkit-mask-size:calc(var(--vfk-mark) * 4.7321) calc(var(--vfk-mark) * 4.7321),100% 100%;   mask-size:calc(var(--vfk-mark) * 4.7321) calc(var(--vfk-mark) * 4.7321),100% 100%   } /* 975ms */
  55%  { -webkit-mask-size:calc(var(--vfk-mark) * 5.6250) calc(var(--vfk-mark) * 5.6250),100% 100%;   mask-size:calc(var(--vfk-mark) * 5.6250) calc(var(--vfk-mark) * 5.6250),100% 100%   } /* 1002ms  from here it decelerates: the */
  60%  { -webkit-mask-size:calc(var(--vfk-mark) * 6.6518) calc(var(--vfk-mark) * 6.6518),100% 100%;   mask-size:calc(var(--vfk-mark) * 6.6518) calc(var(--vfk-mark) * 6.6518),100% 100%   } /* 1030ms  opening is calm, not a whip-pan */
  65%  { -webkit-mask-size:calc(var(--vfk-mark) * 7.8125) calc(var(--vfk-mark) * 7.8125),100% 100%;   mask-size:calc(var(--vfk-mark) * 7.8125) calc(var(--vfk-mark) * 7.8125),100% 100%   } /* 1057ms */
  70%  { -webkit-mask-size:calc(var(--vfk-mark) * 9.1071) calc(var(--vfk-mark) * 9.1071),100% 100%; mask-size:calc(var(--vfk-mark) * 9.1071) calc(var(--vfk-mark) * 9.1071),100% 100% } /* 1085ms */
  75%  { -webkit-mask-size:calc(var(--vfk-mark) * 10.5357) calc(var(--vfk-mark) * 10.5357),100% 100%; mask-size:calc(var(--vfk-mark) * 10.5357) calc(var(--vfk-mark) * 10.5357),100% 100% } /* 1112ms */
  80%  { -webkit-mask-size:calc(var(--vfk-mark) * 12.1429) calc(var(--vfk-mark) * 12.1429),100% 100%; mask-size:calc(var(--vfk-mark) * 12.1429) calc(var(--vfk-mark) * 12.1429),100% 100% } /* 1140ms  the fade starts under it here */
  85%  { -webkit-mask-size:calc(var(--vfk-mark) * 13.8393) calc(var(--vfk-mark) * 13.8393),100% 100%; mask-size:calc(var(--vfk-mark) * 13.8393) calc(var(--vfk-mark) * 13.8393),100% 100% } /* 1167ms */
  90%  { -webkit-mask-size:calc(var(--vfk-mark) * 15.6250) calc(var(--vfk-mark) * 15.6250),100% 100%; mask-size:calc(var(--vfk-mark) * 15.6250) calc(var(--vfk-mark) * 15.6250),100% 100% } /* 1195ms */
  95%  { -webkit-mask-size:calc(var(--vfk-mark) * 17.5000) calc(var(--vfk-mark) * 17.5000),100% 100%; mask-size:calc(var(--vfk-mark) * 17.5000) calc(var(--vfk-mark) * 17.5000),100% 100% } /* 1222ms  corners geometrically gone */
  100% { -webkit-mask-size:calc(var(--vfk-mark) * 19.6429) calc(var(--vfk-mark) * 19.6429),100% 100%; mask-size:calc(var(--vfk-mark) * 19.6429) calc(var(--vfk-mark) * 19.6429),100% 100% } /* 1250ms */
}

/* THE LIGHT IN THE OPENING. Full while the hole is still small enough that the
   logo sits inside it — so the bolt reads as igniting, never as a dark notch —
   then cools away and leaves the app standing there. */
@keyframes vfk-light{
  0%,50%     { opacity:0   }  /* 0-700ms   masked to nothing anyway */
  50.01%     { opacity:1   }  /* 700ms     the mark lights from within */
  62.5%      { opacity:1   }  /* 875ms     still filling the whole opening */
  65%        { opacity:.5  }  /* 910ms     cooling from the middle outward, so the */
  67.86%     { opacity:.15 }  /* 950ms     last thing to go is the rim of the opening */
  71.43%,100%{ opacity:0   }  /* 1000ms    and the app is what was behind it */
}

/* THE LAST OF THE NAVY. Starts while the opening is still eating the display,
   so the two finish together and the corners dissolve instead of snapping shut. */
@keyframes vfk-clear{
  0%,80.71%{ opacity:1; visibility:visible } /* 0-1130ms  overlaps the last of the opening on purpose: */
  95%      { opacity:0; visibility:visible }
  100%     { opacity:0; visibility:hidden }  /* inert for good: the node stays, but paints and hit-tests nothing */                    /* 1330ms    the corners dissolve rather than being eaten.
                                                          Nothing but transform/opacity/filter/mask-size/
                                                          stroke-dashoffset is ever animated - the element
                                                          is taken out of the DOM below, not hidden. */
}

/* ── REDUCED MOTION: no strike, no fork, no aperture. The launch image simply
   fades to the app in 200ms. ─────────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  #sc-splash-vfork, #sc-splash-vfork *{ animation:none !important; }
  #sc-splash-vfork{ animation:vfk-reduced 200ms linear both !important; }
  #sc-splash-vfork .vfk-fork,
  #sc-splash-vfork .vfk-flash,
  #sc-splash-vfork .vfk-flare,
  #sc-splash-vfork .vfk-halo,
  #sc-splash-vfork .vfk-light{ display:none !important; }
  /* the icon keeps its base scale(1) rather than transform:none, so it rasterises
     identically to the motion path and the handoff stays pixel-clean here too */
  #sc-splash-vfork .vfk-icon{ opacity:1 !important; }
}
@keyframes vfk-reduced{
  0%  { opacity:1 }
  /* visibility, not just opacity: the full sequence ends inert and this path
     must too, or a reduced-motion user is left with a transparent
     full-screen fixed layer sitting over the app for the rest of the session. */
  100%{ opacity:0; visibility:hidden }
}
html.sc-nosplash #sc-splash-vfork{display:none!important}

/* HIDDEN UNLESS THE GUARD SCRIPT ARMED IT. The guard above runs at parse time
   on a document load and adds `sc-splash-armed` for a launch. Markup that
   arrives any other way — mounted by React during a client-side navigation,
   where inline scripts never execute — has no guard run, no class, and stays
   display:none. Before this the default was to PLAY, so tapping the Home tab
   from Contacts or Links replayed the lightning (2026-09-03). The handoff
   script removes the class once the sequence has ended (the root is already
   visibility:hidden by then, so the switch to display:none is invisible), so
   a later re-mount inside the same session cannot reuse the launch's arming. */
html:not(.sc-splash-armed) #sc-splash-vfork{display:none!important}

/* THE BODY MUST NOT BE TRANSFORMED WHILE THE OVERLAY IS UP.
   `html.native-app body` carries a 340ms `sc-native-page-in` rise (opacity +
   translateY(10px)) on every document load. A transformed <body> becomes the
   containing block for this fixed overlay, which broke it two ways: the mark
   sat 10px low for the first 340ms and then SNAPPED up when the transform
   resolved to none, and in landscape the overlay sized itself to the body box
   (844x512) instead of the screen (844x390), throwing the icon 104px off
   centre. Suppressing the rise costs nothing — it runs entirely behind an
   opaque splash — and it is scoped to the launch case only, so ordinary
   in-app navigations (.sc-nosplash) keep their page-in. */
html.native-app:not(.sc-nosplash) body{ animation:none !important; }

/* HOLD ON FRAME 0 UNTIL THE NATIVE SPLASH IS ACTUALLY GONE.
   iOS covers the webview with the static launch image until SplashScreen.hide()
   runs. That used to happen in NativeAppBridge's effect — i.e. only after React
   hydrated, 1-3s into a cold open on a remote-URL shell — while this overlay's
   1400ms clock started at PARSE. The lightning therefore played underneath an
   opaque native splash and the user saw whatever slice of it happened to be
   left: most of it on a warm fast launch, none at all on a slow one. It was
   never the same twice.
   Frame 0 here is pixel-identical to the launch image, so freezing on it is
   invisible; the script below hands off the moment the overlay has painted and
   releases the hold, and the sequence then always starts from its first frame.
   animation-play-state does not inherit, hence the descendant selector. */
html.sc-splash-hold #sc-splash-vfork,
html.sc-splash-hold #sc-splash-vfork *{ animation-play-state:paused !important; }

/* NO FRAME MAY EVER BE BLACK. The navy field is painted by .vfk-plane, which
   is only visible THROUGH its two data-URI mask images — and WebKit decodes
   those asynchronously. On a real device there is a window after this overlay
   is in the DOM where the plane paints as NOTHING, and the screen shows the
   app's near-black body instead: that was the "logo → black flash → animation"
   glitch on cold open (2026-08-31). Desktop Chromium decodes inline images
   fast enough that no local test ever saw it.
   While the sequence is held on frame 0 the aperture is closed and the frame
   is a full navy field anyway, so an opaque root background is pixel-safe —
   and a plain color needs no decode, so it paints on the very first frame.
   It leaves with the hold class, which the script below only releases after
   every image has actually decoded. */
html.sc-splash-hold #sc-splash-vfork{ background:#1A2342; }
</style>
<script>
/* THE HANDOFF. Two frames after this overlay is in the DOM it has certainly
   painted, so the native launch image can be dropped — and we drop it from
   here, through the bridge Capacitor injects before any page script, rather
   than waiting for React to hydrate and NativeAppBridge to do it. That is the
   difference between a launch animation that starts when the screen is
   actually ours and one that starts whenever hydration happens to finish.
   The hold is released when hide() reports the native splash gone, so frame 0
   of the sequence is the first frame the user can see.
   Every failure path still releases: hide() rejecting, the plugin missing from
   an older shell (its native auto-hide is 4000ms, so we wait past it), or the
   promise never settling. The overlay can stall on a frame that looks exactly
   like the launch image; it can never stall the app. */
(function(){
  var d=document.documentElement, released=false, disarmed=false;
  /* Once the sequence has ended, drop the arming so the overlay is display:none
     for the rest of the session — even if React mounts this markup again on a
     later navigation. animationend on the root marks the end; the timeout is
     the backstop (the sequence is 1400ms, 200ms under reduced motion). */
  function disarm(){ if(disarmed)return; disarmed=true; d.classList.remove("sc-splash-armed"); }
  function release(){
    if(released)return; released=true; d.classList.remove("sc-splash-hold");
    try{ var r=document.getElementById("sc-splash-vfork"); if(r) r.addEventListener("animationend", function(e){ if(e.target===r) disarm(); }); }catch(e){}
    setTimeout(disarm, 3000);
  }
  if(!d.classList.contains("sc-splash-hold")) return;   /* in-app navigation: nothing to hand off */
  var plugin=null;
  try{ plugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SplashScreen; }catch(e){}
  /* Backstop first, so an exception below can never leave the hold armed. */
  /* Erring late here is invisible — the held frame IS the launch image, so a
     late release only means the branded screen sits a moment longer. Erring
     EARLY is the bug this whole mechanism exists to kill: it starts the
     lightning under an opaque native splash. So the plugin-present backstop is
     ~13x the ~150ms a healthy hide() takes, which a congested bridge on a cold
     open cannot plausibly overrun, and the no-plugin one waits out that
     shell's 4000ms native auto-hide. */
  setTimeout(release, plugin ? 2000 : 4100);
  /* Painted-in-the-DOM is not painted-on-screen: every image here is an
     inline data URI, and WebKit decodes them off the main thread — so a
     double-rAF can fire while the plane's mask images are still undecoded and
     the overlay is visually blank. Dropping the native splash at that moment
     is the black flash. So first decode everything the overlay draws with
     (the icon <img> plus every data-URI mask/background), THEN wait two
     frames for the composite, THEN hide. A 700ms cap keeps a decode failure
     from stalling the launch — the root's held navy covers that worst case. */
  function decoded(cb){
    var jobs=[], seen={}, done=false;
    function fin(){ if(!done){ done=true; cb(); } }
    try{
      var els=document.querySelectorAll("#sc-splash-vfork, #sc-splash-vfork *");
      for(var i=0;i<els.length;i++){
        var el=els[i];
        if(el.tagName==="IMG"){ jobs.push(el); continue; }
        var cs=getComputedStyle(el);
        var blob=(cs.webkitMaskImage||"")+","+(cs.maskImage||"")+","+(cs.backgroundImage||"");
        var re=/url\("?(data:image[^")]+)"?\)/g, m;
        while((m=re.exec(blob))){
          if(seen[m[1]]) continue; seen[m[1]]=1;
          var im=new Image(); im.src=m[1]; jobs.push(im);
        }
      }
    }catch(e){}
    if(!jobs.length){ fin(); return; }
    var left=jobs.length;
    function one(){ if(!done && --left<=0) fin(); }
    setTimeout(fin, 700);
    for(var k=0;k<jobs.length;k++){
      var j=jobs[k];
      if(j.decode){ j.decode().then(one,one); }
      else if(j.complete){ one(); }
      else { j.onload=j.onerror=one; }
    }
  }
  decoded(function(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){
    if(!plugin||!plugin.hide){ return; }
    try{
      var r=plugin.hide({fadeOutDuration:120});
      if(r&&typeof r.then==="function"){ r.then(release, release); } else { release(); }
    }catch(e){ release(); }
  }); }); });
})();
</script>
